name: Security gate

# Fail closed: if a production dependency on main has a known high or critical vulnerability,
# redeploy Reef in maintenance mode (every request gets 503; the cleanup cron keeps running so
# files still expire). The next normal deploy, e.g. Dependabot's fix, brings it back.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
      - name: Take Reef offline
        if: steps.audit.outcome == 'failure'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec wrangler deploy --var MAINTENANCE:1
          echo "::error::High or critical vulnerability in a production dependency. Reef is in maintenance mode until a fixed version deploys."
          exit 1
